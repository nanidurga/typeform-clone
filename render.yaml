services:
  - type: web
    name: typeform-clone-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        value: sqlite:///./data/app.db
      - key: CORS_ORIGINS
        # after deploying the frontend, replace with your Vercel URL, e.g.
        # https://your-app.vercel.app,http://localhost:3000
        value: http://localhost:3000
      - key: PYTHON_VERSION
        value: 3.12.4
